version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: docuprocess_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-docuprocess}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docuprocess"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend API Service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuprocess_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-docuprocess}
      SECRET_KEY: ${SECRET_KEY:-supersecretkeywhichshouldbechangedinproduction}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

  # 3. Huey AI Worker Background Service
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuprocess_worker
    restart: unless-stopped
    command: ["python", "-m", "huey.bin.huey_consumer", "tasks.huey"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-docuprocess}
    volumes:
      - uploads_data:/app/uploads

  # 4. Vite React Frontend Service (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docuprocess_frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"
      - "80:80"

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
